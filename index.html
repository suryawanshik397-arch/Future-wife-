<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For My Future Wife 💖</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Arial', sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        height: 100vh;
        overflow: hidden;
    }

    h1 {
        margin-top: 60px;
        color: #fff;
        font-size: 32px;
    }

    p {
        color: #fff;
        font-size: 20px;
        margin: 20px;
    }

    .btn {
        padding: 12px 25px;
        font-size: 18px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        margin: 15px;
        transition: 0.3s;
    }

    #yesBtn {
        background-color: #28a745;
        color: white;
    }

    #noBtn {
        background-color: #dc3545;
        color: white;
        position: absolute;
    }

    .hidden {
        display: none;
    }

    #loveMsg {
        font-size: 26px;
        color: #fff;
        margin-top: 30px;
    }
</style>
</head>
<body>

<h1>Hey Future Wife 😘</h1>
<p>I know sometimes I act stupid… but one thing is always true ❤️</p>
<p><b>I Love You So Much 💖</b></p>

<h2>Will you always stay with me? 🥺</h2>

<button id="yesBtn" class="btn">Yes 😍</button>
<button id="noBtn" class="btn">No 😜</button>

<div id="loveMsg" class="hidden">
    Yaaaay!!! 😍💖<br>
    Now you are officially mine forever 😘<br>
    I promise to love you, irritate you, and never leave you ❤️
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const loveMsg = document.getElementById("loveMsg");

// Move "No" button randomly
noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

// On Yes click
yesBtn.addEventListener("click", () => {
    loveMsg.classList.remove("hidden");
});
</script>

</body>
</html>
