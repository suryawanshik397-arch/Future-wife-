<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For My Love ❤️</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
  background: black;
  color: white;
}

.screen {
  position: absolute;
  width: 100%;
  height: 100%;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

.active {
  display: flex;
}

h1, h2 {
  animation: fadeIn 2s;
}

button {
  padding: 12px 25px;
  margin: 10px;
  font-size: 18px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  background: #ff4d6d;
  color: white;
}

button:hover {
  transform: scale(1.1);
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

/* Floating hearts */
.heart {
  position: absolute;
  color: red;
  animation: float 5s linear infinite;
}

@keyframes float {
  0% {transform: translateY(100vh);}
  100% {transform: translateY(-10vh);}
}
</style>
</head>

<body>

<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3">
</audio>

<!-- Screen 1 -->
<div class="screen active" id="s1">
  <h1>Hey Dipu ❤️</h1>
  <button onclick="next(2)">Tap to Start</button>
</div>

<!-- Screen 2 -->
<div class="screen" id="s2">
  <h2 id="typing"></h2>
  <button onclick="next(3)">Next</button>
</div>

<!-- Screen 3 -->
<div class="screen" id="s3">
  <h2>You are my everything 💕</h2>
  <button onclick="next(4)">Next</button>
</div>

<!-- Screen 4 -->
<div class="screen" id="s4">
  <h1>Will you be mine forever? 💍</h1>
  <button onclick="yes()">Yes 😍</button>
  <button id="no">No 😜</button>
</div>

<!-- Screen 5 -->
<div class="screen" id="s5">
  <h1>Yayyyyy 🥹❤️</h1>
  <h2>I Love You Forever 💖</h2>
</div>

<script>
function next(n){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("s"+n).classList.add("active");
}

// typing effect
let text = "I may not be perfect, but my love for you is real ❤️";
let i = 0;
function type(){
  if(i < text.length){
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(type, 50);
  }
}
type();

// yes click
function yes(){
  next(5);
}

// moving NO button
let no = document.getElementById("no");
no.addEventListener("mouseover", ()=>{
  no.style.position = "absolute";
  no.style.left = Math.random()*80 + "%";
  no.style.top = Math.random()*80 + "%";
});

// floating hearts
setInterval(()=>{
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random()*100 + "%";
  heart.style.fontSize = (Math.random()*20+10)+"px";
  document.body.appendChild(heart);

  setTimeout(()=>{heart.remove()},5000);
},300);
</script>

</body>
</html>
